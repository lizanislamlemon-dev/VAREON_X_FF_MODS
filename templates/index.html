<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAREON STUDIO | Account Generator</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #FAFAFA;
            --accent-red: #FF3B30;
            --accent-orange: #FF9500;
            --accent-gradient: linear-gradient(135deg, #FF3B30 0%, #FF9500 100%);
            --text-dark: #1C1C1E;
            --text-muted: #8E8E93;
            --border-color: #E5E5EA;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .logo-container {
            display: inline-block;
            background: #FFFFFF;
            padding: 8px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .logo-container img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        .header h1 {
            margin-top: 10px;
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--card-shadow);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #FFFFFF;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--accent-orange);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }

        .status-success {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }

        .status-error {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }

        .footer {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
        }

        .footer-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 6px;
        }

        .footer-link {
            color: var(--text-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-link i {
            color: var(--accent-red);
        }

        .developer-badge {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="https://pub-4c6b2dbf3a0c4862a8964b1546de6283.r2.dev/1788108247140_47gr4.webp" alt="Logo">
        </div>
        <h1>VAREON STUDIO</h1>
        <p>Automated Account Generator Portal</p>
    </header>

    <main class="main-content">
        <div class="card">
            <div class="form-group">
                <label for="chatId">Telegram Chat ID</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" id="chatId" placeholder="Enter your Telegram Chat ID" required>
                </div>
            </div>

            <div class="form-group">
                <label for="region">Region / Country</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-globe"></i>
                    <select id="region">
                        <option value="BD">BD (Bangladesh)</option>
                        <option value="IND">IND (India)</option>
                        <option value="BR">BR (Brazil)</option>
                        <option value="US">US (United States)</option>
                        <option value="SG">SG (Singapore)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="prefix">Account Prefix (Name)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-signature"></i>
                    <input type="text" id="prefix" value="VS_NARUTO" placeholder="e.g. VS_NARUTO" required>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">Generation Amount</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-layer-group"></i>
                    <input type="number" id="amount" value="10" min="1" max="500" placeholder="Number of accounts" required>
                </div>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="startGeneration()">
                <i class="fa-solid fa-bolt"></i> Start Generation
            </button>

            <div id="statusBox" class="status-box"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-info">
            <a href="https://t.me/Vareonstudioofc" target="_blank" class="footer-link">
                <i class="fa-brands fa-telegram"></i> @Vareonstudioofc
            </a>
            <a href="https://wa.me/8801889221262" target="_blank" class="footer-link">
                <i class="fa-brands fa-whatsapp"></i> 01889221262
            </a>
        </div>
        <div class="developer-badge">
            <i class="fa-solid fa-code"></i> Dev: <strong>SHEZIN BOY</strong>
        </div>
    </footer>

    <script>
        async function startGeneration() {
            const chatId = document.getElementById('chatId').value.trim();
            const region = document.getElementById('region').value;
            const prefix = document.getElementById('prefix').value.trim();
            const amount = document.getElementById('amount').value;
            const statusBox = document.getElementById('statusBox');
            const submitBtn = document.getElementById('submitBtn');

            if (!chatId) {
                showStatus('Please enter your Telegram Chat ID.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating Accounts...';
            statusBox.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, region: region, prefix: prefix, amount: amount })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus(result.message, 'success');
                } else {
                    showStatus(result.message || 'Generation failed.', 'error');
                }
            } catch (err) {
                showStatus('Network connection error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Start Generation';
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'status-box status-' + type;
            statusBox.innerText = message;
            statusBox.style.display = 'block';
        }
    </script>
</body>
</html>
